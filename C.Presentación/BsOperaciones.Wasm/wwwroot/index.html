<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BUSSERSA - Portal de Operaciones y Asistencia</title>
    <meta name="description" content="Portal interno de Gestión Operativa y Asistencia de BUSSERSA para la administración de personal y control logístico." />
    <meta name="keywords" content="operaciones, asistencia, personal, logistica, bussersa" />
    <base href="/" />

    <!-- Configuración PWA (Progressive Web App) para Tablets y Móviles -->
    <link href="manifest.json" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <meta name="theme-color" content="#013161" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Busser Tablet" />

    <link rel="stylesheet" href="https://unpkg.com/@tabler/core@1.0.0-beta2/dist/css/tabler.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="css/site.css" rel="stylesheet" />
    <link href="BsOperaciones.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <!-- Loader Premium animado de BUSSERSA -->
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #013161; font-family: 'Roboto', sans-serif; color: #ffffff; margin: 0; overflow: hidden;">
            <div style="width: 50px; height: 50px; border: 5px solid rgba(255, 255, 255, 0.1); border-top: 5px solid #f26631; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;"></div>
            <div style="font-size: 1rem; font-weight: 500; letter-spacing: 2px; text-transform: uppercase;">Cargando Módulo...</div>
        </div>
        <style>
            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }
        </style>
    </div>

    <div id="blazor-error-ui">
        Ha ocurrido un error.
        <a href="" class="reload">Recargar</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/site.js"></script>
    <script src="js/app.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>

    <!-- Registro de Service Worker PWA y Detección de Instalación -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(reg => console.log('Service Worker Busser Tablet registrado con éxito:', reg.scope))
                .catch(err => console.warn('Error al registrar Service Worker:', err));
        }

        window.deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            window.deferredPrompt = e;
            console.log('PWA Busser Tablet: Evento beforeinstallprompt capturado. Lista para instalar.');
            window.dispatchEvent(new CustomEvent('pwa-installable'));
        });

        window.installPwaApp = async () => {
            if (window.deferredPrompt) {
                window.deferredPrompt.prompt();
                const choiceResult = await window.deferredPrompt.userChoice;
                window.deferredPrompt = null;
                return choiceResult.outcome === 'accepted';
            }
            return false;
        };

        window.isAppInstalled = () => {
            return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        };
    </script>
</body>

</html>
